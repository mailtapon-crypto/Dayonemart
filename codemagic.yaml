workflows:
  android-apk:
    name: Android release APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - android-apk-secrets
    scripts:
      - name: Prepare Android configuration and signing
        script: |
          set -euo pipefail

          : "${GOOGLE_SERVICES_JSON_BASE64:?Set GOOGLE_SERVICES_JSON_BASE64 in the android-apk-secrets group}"
          : "${ANDROID_SECRETS_XML_BASE64:?Set ANDROID_SECRETS_XML_BASE64 in the android-apk-secrets group}"
          : "${ANDROID_KEYSTORE_BASE64:?Set ANDROID_KEYSTORE_BASE64 in the android-apk-secrets group}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD in the android-apk-secrets group}"
          : "${ANDROID_KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD in the android-apk-secrets group}"
          : "${ANDROID_KEY_ALIAS:?Set ANDROID_KEY_ALIAS in the android-apk-secrets group}"

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          printf '%s' "$ANDROID_SECRETS_XML_BASE64" | base64 --decode > android/app/src/main/res/values/secrets.xml
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > android/key.properties
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build signed release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
