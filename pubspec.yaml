  file_picker: ^13.1.0
  chewie: ^1.17.2
  emoji_keyboard_flutter: ^1.7.5
  flutter_widget_from_html: ^0.17.4
  speech_to_text: ^7.5.0
  permission_handler: ^13.0.2
