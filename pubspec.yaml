  flutter_html_to_pdf_plus: ^0.4.0
  google_fonts: ^8.2.1
  flutter_image_compress: ^2.5.1
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  injectable_generator: ^3.0.2

flutter_gen:
  output: lib/config/util/
  line_length: 80
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true
  generate: true


  assets:
    - assets/images/
    - assets/images/svg/
    - assets/images/svg/flags/
    - assets/images/gif/
    - assets/json/